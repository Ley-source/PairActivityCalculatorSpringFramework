<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Galaxy Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                    radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                    radial-gradient(2px 2px at 40px 70px, #fff, transparent),
                    radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                    radial-gradient(1px 1px at 130px 80px, #fff, transparent),
                    radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
            background-size: 200px 100px;
            animation: twinkle 5s infinite;
            opacity: 0.6;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .header-text {
            position: absolute;
            top: 25px;
            left: 30px;
            color: #c9a0dc;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1px;
            z-index: 2;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }
        .calculator {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 20px;
            padding: 25px;
            width: 360px;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.4),
            0 0 80px rgba(75, 0, 130, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.3);
            position: relative;
            z-index: 1;
        }
        .display {
            background: linear-gradient(180deg, #0f0f23, #1a1a3e);
            border-radius: 12px;
            padding: 20px 15px;
            margin-bottom: 20px;
            text-align: right;
            min-height: 90px;
            border: 1px solid rgba(138, 43, 226, 0.2);
        }
        .expression {
            color: #a0a0c0;
            font-size: 16px;
            min-height: 24px;
            word-wrap: break-word;
        }
        .result {
            color: #fff;
            font-size: 36px;
            font-weight: 300;
            margin-top: 5px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 60px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 500;
        }
        button:active { transform: scale(0.95); }
        .btn-number {
            background: linear-gradient(145deg, #2d2d4a, #252542);
            color: #fff;
        }
        .btn-number:hover { background: linear-gradient(145deg, #3d3d5a, #353552); }
        .btn-operator {
            background: linear-gradient(145deg, #6b4c9a, #5a3d82);
            color: #fff;
        }
        .btn-operator:hover { background: linear-gradient(145deg, #7b5caa, #6a4d92); }
        .btn-equals {
            background: linear-gradient(145deg, #9b59b6, #8e44ad);
            color: #fff;
        }
        .btn-equals:hover { background: linear-gradient(145deg, #ab69c6, #9e54bd); }
        .btn-clear {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: #fff;
        }
        .btn-clear:hover { background: linear-gradient(145deg, #f75c4c, #d0493b); }
        .btn-delete {
            background: linear-gradient(145deg, #e67e22, #d35400);
            color: #fff;
        }
        .btn-delete:hover { background: linear-gradient(145deg, #f68e32, #e36410); }
        .btn-paren {
            background: linear-gradient(145deg, #3498db, #2980b9);
            color: #fff;
        }
        .btn-paren:hover { background: linear-gradient(145deg, #44a8eb, #3990c9); }
        .title {
            text-align: center;
            color: #c9a0dc;
            font-size: 14px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
<div class="header-text">Calculator using Spring Framework :))</div>

<div class="calculator">
    <div class="title" style="font-size: 28px;">😊</div>
    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
        <button class="btn-clear" onclick="clearAll()">AC</button>
        <button class="btn-delete" onclick="deleteLast()">⌫</button>
        <button class="btn-paren" onclick="append('(')">(</button>
        <button class="btn-paren" onclick="append(')')">)</button>

        <button class="btn-number" onclick="append('7')">7</button>
        <button class="btn-number" onclick="append('8')">8</button>
        <button class="btn-number" onclick="append('9')">9</button>
        <button class="btn-operator" onclick="append('/')">÷</button>

        <button class="btn-number" onclick="append('4')">4</button>
        <button class="btn-number" onclick="append('5')">5</button>
        <button class="btn-number" onclick="append('6')">6</button>
        <button class="btn-operator" onclick="append('*')">×</button>

        <button class="btn-number" onclick="append('1')">1</button>
        <button class="btn-number" onclick="append('2')">2</button>
        <button class="btn-number" onclick="append('3')">3</button>
        <button class="btn-operator" onclick="append('-')">−</button>

        <button class="btn-number" onclick="append('0')">0</button>
        <button class="btn-number" onclick="append('.')">.</button>
        <button class="btn-operator" onclick="append('+')">+</button>
        <button class="btn-equals" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let currentExpression = '';

    function append(value) {
        currentExpression += value;
        document.getElementById('expression').textContent = currentExpression;
        document.getElementById('result').textContent = '';
    }

    function clearAll() {
        currentExpression = '';
        document.getElementById('expression').textContent = '';
        document.getElementById('result').textContent = '0';
    }

    function deleteLast() {
        currentExpression = currentExpression.slice(0, -1);
        document.getElementById('expression').textContent = currentExpression;
        if (!currentExpression) {
            document.getElementById('result').textContent = '0';
        }
    }

    function calculate() {
        if (!currentExpression) return;

        fetch('/calculate-ajax?expression=' + encodeURIComponent(currentExpression))
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('result').textContent = 'Error';
                } else {
                    document.getElementById('result').textContent = data.result;
                    currentExpression = data.result;
                }
            })
            .catch(() => {
                document.getElementById('result').textContent = 'Error';
            });
    }
</script>
</body>
</html>
